[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "threat-modeling-py"
version = "1.0.0"
description = "Threat Modeling as Code - a declarative STRIDE threat-modeling library for Python"
readme = "README.md"
authors = [
    {name = "Parthiv Rawat", email = "parthiv05022000@gmail.com"}
]
maintainers = [
    {name = "Parthiv Rawat", email = "parthiv05022000@gmail.com"}
]
license = "MIT"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
keywords = [
    "threat",
    "threat-modeling",
    "stride",
    "security",
    "risk",
    "mitigation",
    "trust-boundary",
    "component",
    "data-flow",
]
requires-python = ">=3.8"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "mypy>=1.0.0",
    "ruff>=0.1.0",
]

[project.urls]
Homepage = "https://github.com/parthivrawat/threat-modeling"
Documentation = "https://github.com/parthivrawat/threat-modeling/tree/main/python#readme"
Repository = "https://github.com/parthivrawat/threat-modeling"
"Bug Tracker" = "https://github.com/parthivrawat/threat-modeling/issues"
Changelog = "https://github.com/parthivrawat/threat-modeling/blob/main/python/CHANGELOG.md"

[tool.setuptools]
packages = ["threat_modeling"]
include-package-data = true

[tool.setuptools.package-data]
threat_modeling = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["test_threat_modeling.py"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v"

[tool.black]
line-length = 100
target-version = ['py38', 'py39', 'py310', 'py311', 'py312']

[tool.ruff]
line-length = 100
target-version = "py38"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = []

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
