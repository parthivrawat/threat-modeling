name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      - name: Go vet
        working-directory: go
        run: go vet ./...
      - name: Go test
        working-directory: go
        run: go test ./...

  python:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dev dependencies
        working-directory: python
        run: pip install -r requirements-dev.txt
      - name: Pytest
        working-directory: python
        run: pytest -v

  rust:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Rust test
        working-directory: rust
        run: cargo test

  typescript:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install dependencies
        working-directory: typescript
        run: npm install
      - name: Type check
        working-directory: typescript
        run: npm run lint
      - name: Build
        working-directory: typescript
        run: npm run build
      - name: Test
        working-directory: typescript
        run: npm test
